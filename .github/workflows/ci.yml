name: Verify research explorer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  artifact-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv venv --python 3.12 .venv-artifacts
      - run: uv pip install --python .venv-artifacts/bin/python -r requirements-artifacts.txt
      - run: .venv-artifacts/bin/python scripts/build_runtime_data.py --output /tmp/thunderquote-build-one
      - run: .venv-artifacts/bin/python scripts/build_runtime_data.py --output /tmp/thunderquote-build-two
      - run: diff -qr /tmp/thunderquote-build-one /tmp/thunderquote-build-two
      - run: diff -qr web/public/data /tmp/thunderquote-build-one
